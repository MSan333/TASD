defaults:
  - optim: fsdp
  - _self_

data:
  train_files: ~/data/dpo/train.parquet
  val_files: ~/data/dpo/test.parquet
  train_batch_size: 64
  micro_batch_size_per_gpu: 2
  max_length: 2048
  max_prompt_length: 1024
  prompt_key: prompt
  chosen_key: chosen
  rejected_key: rejected
  train_max_samples: -1
  val_max_samples: -1
  dataloader_num_workers: 4
  seed: 42

algorithm:
  beta: 0.1
  loss_type: sigmoid
  label_smoothing: 0.0

model:
  partial_pretrain: ~/models/Qwen2.5-7B-Instruct
  trust_remote_code: False
  fsdp_config:
    model_dtype: bfloat16
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  enable_gradient_checkpointing: True
  lora_rank: 0
  lora_alpha: 16
  target_modules: all-linear
  strategy: fsdp

optim:
  lr: 5e-7
  betas: [0.9, 0.95]
  weight_decay: 0.01
  lr_warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine

trainer:
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  default_hdfs_dir: null
  project_name: dpo_training
  experiment_name: dpo_run
  group_name: null
  total_epochs: 3
  total_training_steps: null
  logger: [console, wandb]
  seed: 42
  save_freq: -1
  test_freq: -1
  max_ckpt_to_keep: 3
  resume_mode: auto
  resume_from_path: null
  checkpoint:
    save_contents: [model, optimizer, extra]
    load_contents: ${trainer.checkpoint.save_contents}
  device: cuda
